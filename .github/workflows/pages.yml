name: Publica les apps a GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'amic-invisible/Index.html', 'amic-invisible/app-id.txt', 'amic-invisible/icona-*.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Xiu-xiu a l'arrel i l'amic invisible a /amic-invisible-bove-palau/
      - name: Prepara el lloc
        run: |
          cp -r app/. _site/
          # La pàgina porta l'identificador de l'aplicació de Google (app-id.txt): així els
          # enllaços personals són curts. /amic-invisible/ es manté pels enllaços antics.
          ID="$(tr -cd 'A-Za-z0-9_-' < amic-invisible/app-id.txt)"
          for dir in amic-invisible amic-invisible-bove-palau; do
            mkdir -p "_site/$dir"
            sed "s/__APP_ID__/$ID/" amic-invisible/Index.html > "_site/$dir/index.html"
            cp amic-invisible/icona-*.png "_site/$dir/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub de vegades triga uns segons a «veure» el paquet que s'acaba de pujar
      # («No artifacts named github-pages»): s'espera i, si cal, es torna a provar.
      - name: Espera que GitHub registri el paquet
        run: sleep 15
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Espera abans de tornar-ho a provar
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Espera una mica més
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
