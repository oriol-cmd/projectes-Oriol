name: Publica les apps a GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'amic-invisible/Index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Xiu-xiu a l'arrel i l'amic invisible a /amic-invisible/
      - name: Prepara el lloc
        run: |
          mkdir -p _site/amic-invisible
          cp -r app/. _site/
          cp amic-invisible/Index.html _site/amic-invisible/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
