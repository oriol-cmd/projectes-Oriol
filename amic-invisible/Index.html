<!DOCTYPE html>
<html lang="ca">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amic invisible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Disseny: etiquetes de regal (amb el foradet del cordill). Quatre estils de color, triats a la pestanya Configuració. */
:root {
  --bg: #eef2ef; --paper: #ffffff; --ink: #17231f; --muted: #5b6b65; --line: #d5ddd9;
  --primary: #1f5a4a; --primary-soft: #e1ece7; --accent: #b3263e; --accent-soft: #f8e3e7;
  --taken: #8a958f; --head: #173f35; --head-ink: #f3f7f5;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-estil="nit"] {
  --bg: #eef0f6; --paper: #ffffff; --ink: #161b2e; --muted: #5a6178; --line: #d6dae6;
  --primary: #24408e; --primary-soft: #e3e8f6; --accent: #a5660a; --accent-soft: #f8ecd6;
  --taken: #8a90a2; --head: #18213f; --head-ink: #f3f4fa;
}
:root[data-estil="gerd"] {
  --bg: #f5eff1; --paper: #ffffff; --ink: #2a1520; --muted: #6e5862; --line: #e5d6dc;
  --primary: #8a2456; --primary-soft: #f5e2eb; --accent: #c2410c; --accent-soft: #fde8dc;
  --taken: #9a8a91; --head: #4a1330; --head-ink: #fbf1f5;
}
:root[data-estil="neu"] {
  --bg: #f1f4f7; --paper: #ffffff; --ink: #1a222b; --muted: #5b6774; --line: #d8dfe6;
  --primary: #2c6488; --primary-soft: #e1edf5; --accent: #c0392b; --accent-soft: #f9e2df;
  --taken: #8b96a1; --head: #2e3d4c; --head-ink: #f4f7fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101816; --paper: #18231f; --ink: #e6eeea; --muted: #9aaba4; --line: #2b3a35;
    --primary: #6cc2a5; --primary-soft: #1c3029; --accent: #f0758a; --accent-soft: #3a1f26;
    --taken: #6f7d77; --head: #0b1311; --head-ink: #e6eeea; color-scheme: dark;
  }
  :root[data-estil="nit"] {
    --bg: #0e1120; --paper: #171b2e; --ink: #e7e9f3; --muted: #9ca2bb; --line: #2a3048;
    --primary: #93aef5; --primary-soft: #1c2440; --accent: #f1c26b; --accent-soft: #3a2f17;
    --taken: #6f7590; --head: #0a0d1a; --head-ink: #e7e9f3;
  }
  :root[data-estil="gerd"] {
    --bg: #170e12; --paper: #22151b; --ink: #f2e6eb; --muted: #b49ca7; --line: #3d2630;
    --primary: #f08cbb; --primary-soft: #3a1a2a; --accent: #fb9a63; --accent-soft: #3d2216;
    --taken: #7d6871; --head: #12080d; --head-ink: #f2e6eb;
  }
  :root[data-estil="neu"] {
    --bg: #0f1419; --paper: #182029; --ink: #e6ecf1; --muted: #9eabb8; --line: #2b3743;
    --primary: #85c1e6; --primary-soft: #1b2b38; --accent: #f2857a; --accent-soft: #3b1f1d;
    --taken: #6d7a87; --head: #0a0e12; --head-ink: #e6ecf1;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

header.top { background: var(--head); color: var(--head-ink); padding-block: 18px 20px; }
header.top .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.mono { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font: 700 15px/1 var(--font-display); letter-spacing: 0.02em; }
.brand small { display: block; font: 500 13px var(--font-body); opacity: 0.75; }
.ghost { background: transparent; border: 1px solid color-mix(in srgb, var(--head-ink) 35%, transparent); color: var(--head-ink); border-radius: 999px; padding: 6px 14px; font-size: 13px; }

.notice { background: var(--primary-soft); color: var(--ink); border-bottom: 1px solid var(--line); padding-block: 10px; font-size: 14px; }

main { padding-block: 20px 60px; display: grid; gap: 20px; }

/* Entrada */
.login { max-width: 420px; margin: 40px auto 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
.login h2 { font-size: 22px; }
.login p { margin: 0; color: var(--muted); }
.code-input { text-transform: uppercase; letter-spacing: 0.25em; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }

/* Pestanyes */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 10px 8px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--head); color: var(--head-ink); }

.hint { color: var(--muted); font-size: 13.5px; margin: 0; display: flex; gap: 8px; align-items: flex-start; }
.hint svg { flex: none; margin-top: 2px; }

/* Formulari */
form.add { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
form.add h3 { font-size: 17px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
input[type="text"], input[type="url"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 10px 12px; color: var(--ink); }
input:focus { border-color: var(--primary); outline: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 600; background: var(--primary); color: var(--paper); }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.55; cursor: default; }

/* Etiquetes de regal */
.tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tag { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 6px 14px 14px 6px; padding: 14px 14px 14px 34px; display: grid; gap: 8px; min-width: 0; }
.tag::before { content: ""; position: absolute; left: 12px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--line); }
.tag .text { font-weight: 600; overflow-wrap: anywhere; }
.tag .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.tag .who { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.themes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.themes li { font-weight: 600; overflow-wrap: anywhere; padding-left: 14px; position: relative; }
.themes li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.tag.is-mine .themes li::before, .pick .themes li::before { background: var(--accent); }
.tag.is-taken .themes li { color: var(--taken); text-decoration: line-through; text-decoration-thickness: 1px; }
.tag.is-taken .themes li::before { background: var(--line); }
.pick .themes li { font-weight: 500; }
.tag.is-empty { border-style: dashed; background: transparent; }
.tag.is-empty .text { color: var(--muted); font-weight: 500; }
.tag.is-mine .who { color: var(--accent); }
.pick { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; }
.pick .who { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.pick-name { font: 700 22px/1.2 var(--font-display); }
.pick .themes { margin-top: 6px; }
.pick .hint { margin-top: 2px; }
.pick.chosen { border-color: var(--accent); background: var(--accent-soft); }
.tag.is-mine { border-color: var(--accent); background: var(--accent-soft); }
.tag.is-mine::before { border-color: var(--accent); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 3px 10px; letter-spacing: 0.01em; }
.chip.free { color: var(--primary); background: var(--primary-soft); }
.chip.mine { color: var(--paper); background: var(--accent); }
.chip.taken { color: var(--taken); border: 1px solid var(--line); }
.small { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.small.mark { border-color: var(--primary); color: var(--primary); }


.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / 0.2); z-index: 5; }
.loading { color: var(--muted); text-align: center; padding: 40px 0; }

@media (max-width: 520px) {
  .brand h1 { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tag { transition: border-color .15s, background-color .15s; }
}
</style>
<script>window.CONFIG = <?!= config ?>;</script>
<script>
  try { document.documentElement.setAttribute('data-estil', (window.CONFIG && window.CONFIG.estil) || 'avet'); } catch (e) {}
</script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mono" id="mono" aria-hidden="true"></span>
      <svg id="giftIcon" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true" hidden>
        <rect x="4" y="13" width="26" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="2" y="9" width="30" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M17 9v22" stroke="currentColor" stroke-width="2"/>
        <path d="M17 9c-2-5-8-6-8-2s6 2 8 2c2 0 8 2 8-2s-6-3-8 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div><h1 id="title">Amic invisible</h1><small id="hello"></small></div>
    </div>
    <button class="ghost" id="logout" type="button" hidden>No sóc jo</button>
  </div>
</header>
<div class="notice" id="notice" hidden><div class="wrap" id="noticeText"></div></div>

<main class="wrap">
  <p class="loading" id="loading">Carregant…</p>

  <form class="login" id="login" hidden>
    <h2>Entra al tauler</h2>
    <p>Escriu el codi de 6 lletres que t'han enviat. Si has obert el teu enllaç personal, entraràs sol.</p>
    <label for="code">El teu codi
      <input class="code-input" id="code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234">
    </label>
    <button class="btn" type="submit" id="loginBtn">Entra</button>
  </form>

  <section id="app" hidden>
    <div style="display:grid;gap:20px">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabMine" aria-selected="true"></button>
        <button type="button" role="tab" id="tabOthers" aria-selected="false">A qui regalo</button>
      </div>

      <div id="paneMine" style="display:grid;gap:16px">
        <p class="hint"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4M8 4.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="mineHint"></span></p>
        <div class="tags" id="mineView"></div>
        <form class="add" id="themeForm">
          <h3 id="formTitle"></h3>
          <div id="fields" style="display:grid;gap:10px"></div>
          <div class="actions">
            <button class="btn" type="submit" id="saveBtn">Desa</button>
            <button class="btn secondary" type="button" id="cancelEdit" hidden>Cancel·la</button>
          </div>
        </form>
      </div>

      <div id="paneOthers" style="display:grid;gap:16px" hidden>
        <div class="pick" id="pickBox"></div>
        <div class="tags" id="othersList"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = 'amic-invisible-codi';
  let code = '';
  let state = null;
  let editing = false;
  let busy = false;

  // ---------- Personalització (pestanya Configuració del full) ----------
  const CFG = Object.assign({ titol: 'Amic invisible', familia: '', avis: '', numTemes: 2, estil: 'avet', exemples: [] }, window.CONFIG || {});
  const N = CFG.numTemes;
  const T = {
    temes: N === 1 ? 'el tema' : 'els temes',
    teus: N === 1 ? 'El teu tema' : 'Els teus temes',
    meus: N === 1 ? 'El meu tema' : 'Els meus temes',
    titol: N === 1 ? 'Quin tema proposes?' : 'Quins ' + N + ' temes proposes?',
    canvia: N === 1 ? 'Canvia el teu tema' : 'Canvia els teus temes',
    falta: N === 1 ? 'Escriu el tema.' : 'Escriu els ' + N + ' temes.',
  };
  const familyLine = CFG.familia ? 'Família ' + CFG.familia : '';

  function personalize() {
    document.documentElement.setAttribute('data-estil', CFG.estil);
    $('title').textContent = CFG.titol;
    $('hello').textContent = familyLine;
    $('hello').hidden = !familyLine;
    const initials = CFG.familia.split(/[\s-]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 3).toUpperCase();
    $('mono').textContent = initials;
    $('mono').hidden = !initials;
    $('giftIcon').hidden = !!initials;
    $('noticeText').textContent = CFG.avis;
    $('notice').hidden = !CFG.avis;
    $('tabMine').textContent = T.meus;
    $('mineHint').textContent = (N === 1 ? 'Escriu un tema' : 'Escriu ' + N + ' temes') +
      ' per al regal que t\'agradaria rebre. Qui te\'l faci ' + (N === 1 ? 'el llegirà' : 'els llegirà') +
      ' i hi pensarà el que cregui. No sabràs qui és fins al dia de l\'intercanvi.';
    $('formTitle').textContent = T.titol;
    $('saveBtn').textContent = N === 1 ? 'Desa el tema' : 'Desa els temes';
    const f = $('fields');
    f.replaceChildren();
    for (let i = 1; i <= N; i++) {
      const l = el('label', null, N === 1 ? 'Tema' : 'Tema ' + i);
      l.htmlFor = 't' + i;
      const inp = el('input');
      inp.id = 't' + i; inp.type = 'text'; inp.maxLength = 120; inp.required = true;
      if (CFG.exemples[i - 1]) inp.placeholder = 'P. ex. ' + CFG.exemples[i - 1];
      l.appendChild(inp);
      f.appendChild(l);
    }
  }
  const fieldIds = () => Array.from({ length: N }, (_, i) => 't' + (i + 1));

  const store = {
    get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} },
  };

  function api(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
  }

  function show(view) {
    $('loading').hidden = view !== 'loading';
    $('login').hidden = view !== 'login';
    $('app').hidden = view !== 'app';
    $('logout').hidden = view !== 'app';
  }

  async function call(fn, ...args) {
    if (busy) return;
    busy = true;
    document.body.style.cursor = 'progress';
    try {
      const s = await api(fn, code, ...args);
      apply(s);
      return s;
    } catch (err) {
      const msg = String((err && err.message) || err);
      if (msg.indexOf('codi-incorrecte') >= 0) { store.set(''); code = ''; show('login'); toast('Aquest codi no és vàlid.'); }
      else toast(msg.replace(/^Error:\s*/, '') || 'No s\'ha pogut desar. Torna-ho a provar.');
    } finally {
      busy = false;
      document.body.style.cursor = '';
    }
  }

  function apply(s) {
    const first = !state;
    state = s;
    if (s.error) toast(s.error);
    $('hello').textContent = (familyLine ? familyLine + ' · ' : '') + 'Hola, ' + s.name;
    $('hello').hidden = false;
    show('app');
    if (first && s.mine) tab('others'); // si ja has posat el teu tema, el que toca és triar
    render();
  }

  // ---------- Pintar ----------

  function themeList(themes) {
    const ul = el('ul', 'themes');
    themes.filter(Boolean).forEach((x) => ul.appendChild(el('li', null, x)));
    return ul;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    // El meu tema
    const mv = $('mineView');
    mv.replaceChildren();
    const form = $('themeForm');
    if (state.mine && !editing) {
      const t = el('article', 'tag');
      t.appendChild(el('div', 'who', T.teus));
      t.appendChild(themeList(state.mine.themes));
      const bar = el('div', 'bar');
      const ed = el('button', 'small', N === 1 ? 'Canvia-ho' : 'Canvia\'ls'); ed.type = 'button';
      ed.onclick = startEdit;
      bar.appendChild(ed);
      t.appendChild(bar);
      mv.appendChild(t);
      form.hidden = true;
    } else {
      form.hidden = false;
    }

    // A qui regalo
    const pb = $('pickBox');
    pb.replaceChildren();
    if (state.myPick) {
      pb.className = 'pick chosen';
      pb.appendChild(el('div', 'who', 'Regales a'));
      pb.appendChild(el('div', 'pick-name', state.myPick.name));
      pb.appendChild(themeList(state.myPick.themes));
    } else {
      pb.className = 'pick';
      pb.appendChild(el('div', 'pick-name', 'Tria a qui regales'));
      pb.appendChild(el('p', 'hint', 'Llegeix els temes i tria una persona: serà a qui regales. Els altres veuran que ja està triada, però ningú sabrà que has estat tu.'));
    }

    const list = $('othersList');
    list.replaceChildren();
    state.others.forEach((p) => {
      const th = p.theme;
      if (!th) {
        const t = el('article', 'tag is-empty');
        t.appendChild(el('div', 'who', p.name));
        t.appendChild(el('div', 'text', 'Encara no ha posat ' + T.temes));
        list.appendChild(t);
        return;
      }
      const t = el('article', 'tag' + (th.status === 'mine' ? ' is-mine' : th.status === 'taken' ? ' is-taken' : ''));
      t.appendChild(el('div', 'who', p.name));
      t.appendChild(themeList(th.themes));
      const bar = el('div', 'bar');
      bar.appendChild(el('span', 'chip ' + th.status, th.status === 'free' ? 'Lliure' : th.status === 'mine' ? 'Li regales tu' : 'Ja està triada'));
      if (th.status === 'free') {
        const b = el('button', 'small mark', state.myPick ? 'Canvia a aquesta' : 'La trio'); b.type = 'button';
        b.onclick = () => call('tria', th.id).then((s) => s && !s.error && toast('Regales a ' + p.name + '. Ningú sabrà que has estat tu.'));
        bar.appendChild(b);
      } else if (th.status === 'mine') {
        const b = el('button', 'small', 'Desfés'); b.type = 'button';
        b.onclick = () => call('desfes').then((s) => s && toast('Desfet. ' + p.name + ' torna a estar lliure.'));
        bar.appendChild(b);
      }
      t.appendChild(bar);
      list.appendChild(t);
    });
  }

  // ---------- Formulari ----------

  function startEdit() {
    editing = true;
    fieldIds().forEach((k, i) => { $(k).value = state.mine.themes[i] || ''; });
    $('formTitle').textContent = T.canvia;
    $('cancelEdit').hidden = false;
    render();
    $('t1').focus();
  }
  function stopEdit() {
    editing = false;
    $('themeForm').reset();
    $('formTitle').textContent = T.titol;
    $('cancelEdit').hidden = true;
    if (state) render();
  }
  $('cancelEdit').onclick = stopEdit;

  $('themeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const theme = fieldIds().map((k) => $(k).value);
    if (theme.some((x) => !x.trim())) { toast(T.falta); return; }
    const wasNew = !state.mine;
    $('saveBtn').disabled = true;
    const s = await call('desa', theme);
    $('saveBtn').disabled = false;
    if (s && !s.error) { toast((N === 1 ? (wasNew ? 'Tema desat' : 'Tema canviat') : (wasNew ? 'Temes desats' : 'Temes canviats')) + (wasNew ? '. Ara tria a qui regales.' : '.')); stopEdit(); }
  });

  // ---------- Pestanyes ----------

  function tab(which) {
    const mine = which === 'mine';
    $('tabMine').setAttribute('aria-selected', String(mine));
    $('tabOthers').setAttribute('aria-selected', String(!mine));
    $('paneMine').hidden = !mine;
    $('paneOthers').hidden = mine;
  }
  $('tabMine').onclick = () => tab('mine');
  $('tabOthers').onclick = () => { tab('others'); refresh(); };

  // ---------- Entrar i sortir ----------

  async function login(c) {
    code = String(c || '').trim().toUpperCase();
    if (!code) { show('login'); return; }
    show(state ? 'app' : 'loading');
    const s = await call('entra');
    if (s) store.set(code);
  }

  $('login').addEventListener('submit', (e) => { e.preventDefault(); login($('code').value); });
  $('logout').onclick = () => { store.set(''); code = ''; state = null; editing = false; $('themeForm').reset(); $('code').value = ''; $('hello').textContent = familyLine; $('hello').hidden = !familyLine; tab('mine'); show('login'); };

  function refresh() { if (code && state && !busy && !editing) call('entra'); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(refresh, 60000);

  personalize();

  // Codi de l'enllaç personal (?codi=XXXXXX) o el que es va desar l'última vegada.
  try {
    google.script.url.getLocation((loc) => {
      const fromLink = loc && loc.parameter && loc.parameter.codi;
      login(fromLink || store.get());
    });
  } catch (e) { login(store.get()); }
})();
</script>
</body>
</html>
